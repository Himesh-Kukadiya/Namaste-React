<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namaste React</title>

    <!-- Place CDN link here to write react code without installing -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>

<body>
    <div>
        <h1> Hello From HTML </h1>
    </div>
    <div id="root">
    </div>
    <div id="react-root">
    </div>
    <div style="border: 2px solid black; padding: 0px 20px;">
        <div id="main">
        </div>
    </div>
</body>

<!-- Add heading from JavaScript -->
<script>
    const root = document.getElementById("root");

    const heading = document.createElement('h1');
    heading.innerHTML = "Namaste From JavaScript!";

    root.appendChild(heading);

</script>

<!-- Add heading from react using CDN -->
<script>
    const react_root = ReactDOM.createRoot(document.getElementById('react-root'))
    const react_heading = React.createElement('h1', {}, 'Namaste From React JS');

    react_root.render(react_heading);
</script>

<!-- Create different-different elements with React  -->
<!-- Espacially create following structure using React  -->
<!-- 
    main
        div
            div#header
                h1
                    `Welcome to my page`
                p
                    `This is a simple paragraph.`

            div#about
                h2
                    `About`
                p
                    `React js widely used for creating single page application.`
            footer#footer
                p
                    `© 2026 My Website`
-->
<script>
    const main = ReactDOM.createRoot(document.getElementById('main'));

    const app = React.createElement('div', {}, [
        // first div for my page
        React.createElement('div', { id: "header" }, [
            React.createElement('h1', {}, 'Welcome to my page'),
            React.createElement('p', {}, 'This is a simple paragraph.')
        ]),

        // Second div for about
        React.createElement('div', { id: "about" }, [
            React.createElement('h2', {}, 'About'),
            React.createElement('p', {}, 'React js widely used for creating single page application.')
        ]),

        // footer
        React.createElement('footer', { id: "footer" },
            React.createElement('p', {}, "© 2026 My Website")
        )
    ]);

    main.render(app);
</script>

</html>
